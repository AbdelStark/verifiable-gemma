[project]
name = "verifiable-gemma"
version = "0.1.0"
description = "Commit-and-audit verification layer for Gemma 4 inference (CommitLLM protocol)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "AbdelStark", email = "AbdelStark@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.13",
    "transformers>=5.5",
    "safetensors>=0.6",
    "numpy>=2.2",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "typer>=0.15",
    "pynacl>=1.5",
    "huggingface-hub>=1.0",
    "accelerate>=1.10",
]

[project.optional-dependencies]
cpu = ["torch>=2.13"]
gpu = ["torch>=2.13"]
modal = ["modal>=1.0"]

[project.scripts]
vg = "vgemma.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vgemma"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.9",
]

# Plain `uv sync` takes torch from PyPI (CPU build on macOS). On Linux, `--extra cpu`
# selects the CPU-only wheel and `--extra gpu` the CUDA 12.9 wheel.
[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu129", extra = "gpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
markers = ["gpu: needs a CUDA device and a real Gemma 4 checkpoint"]

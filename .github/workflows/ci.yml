name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    name: tiny-mode tests (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (locked, CPU-only torch)
        run: uv sync --locked --extra cpu
      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Tests
        run: uv run pytest -q
